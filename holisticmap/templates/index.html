<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Holistic Map</title>
    <link rel="stylesheet" href="{% static 'holisticmap/styles.css' %}">
</head>
<body>
    <!-- Main Content -->
    <main class="container">
        <section class="card welcome-card">
            <h1>Welcome to Holistic Map</h1>
            <p class="muted">Manage skills, roles, and employees efficiently</p>

            <div class="action-buttons">
                <a class="btn" href="{% url 'login' %}">Login</a>
                <a class="btn-secondary" href="{% url 'register_executive' %}">Sign Up as Executive</a>
                <a class="btn-secondary" href="{% url 'register_employer' %}">Sign Up as Employer</a>
                <a class="btn-secondary" href="{% url 'register_employee' %}">Sign Up as Employee</a>
            </div>
        </section>
    </main>
</body>
</html>
