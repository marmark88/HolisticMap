<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <title>Create Role - Holistic Map</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="{% static 'holisticmap/favicon.svg' %}">
    <link rel="stylesheet" href="{% static 'holisticmap/styles.css' %}">
</head>

<body>
    <main class="container">
        <section class="card">
            <h1>Create a New Role for {{ company.name }}</h1>
            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="title">Role Title:</label>
                    <input type="text" id="title" name="title" placeholder="Role title" required>
                </div>

                <div class="form-group">
                    <label for="description">Role Description:</label>
                    <textarea id="description" name="description" placeholder="Describe the role..." rows="4" required></textarea>
                </div>

                <div class="form-group">
                    <label for="required_skills">Required Skills (comma separated, format: Skill|Years):</label>
                    <input type="text" id="required_skills" name="required_skills" placeholder="Python|3, Django|2, SQL|2">
                </div>

                <div class="form-group">
                    <label for="preferred_skills">Preferred Skills (comma separated, format: Skill|Years):</label>
                    <input type="text" id="preferred_skills" name="preferred_skills" placeholder="AWS|1, React|2, Docker|1">
                </div>

                <div class="form-group">
                    <label for="required_education">Required Education (comma separated, format: Degree|Field):</label>
                    <input type="text" id="required_education" name="required_education" placeholder="BS|Computer Science, MS|Data Science">
                </div>

                <div class="form-group">
                    <label for="preferred_education">Preferred Education (comma separated, format: Degree|Field):</label>
                    <input type="text" id="preferred_education" name="preferred_education" placeholder="MBA|Business Administration">
                </div>

                <button type="submit">Create Role</button>
            </form>
        </section>
    </main>
</body>
</html>
