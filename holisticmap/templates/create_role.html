<!DOCTYPE html>
<html lang="en">
<head>
    {% load static %}
    <title>Create Role - Holistic Map</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'holisticmap/styles.css' %}">
</head>

<body>
    <main class="container">
        <section class="card">
            <h1>Create a New Role for {{ company.name }}</h1>
            <form method="post">
                {% csrf_token %}

                <div class="form-group">
                    <label for="title">Role Title:</label>
                    <input type="text" id="title" name="title" placeholder="Role title" required>
                </div>

                <div class="form-group">
                    <label for="description">Role Description:</label>
                    <textarea id="description" name="description" placeholder="Describe the role..." rows="4" required></textarea>
                </div>

                <div class="form-group">
                    <label for="skills">Required Skills (comma separated):</label>
                    <input type="text" id="skills" name="skills" placeholder="Python, Django, SQL">
                </div>

                <button type="submit">Create Role</button>
            </form>
        </section>
    </main>
</body>
</html>
