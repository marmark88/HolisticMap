# Install: sudo cp holisticmap.conf /etc/nginx/sites-available/holisticmap
# sudo ln -s /etc/nginx/sites-available/holisticmap /etc/nginx/sites-enabled/
# Replace YOUR_DOMAIN_HERE, then: sudo nginx -t && sudo systemctl reload nginx
#
# Obtain TLS certs (after DNS points here):
#   sudo certbot --nginx -d your.domain.com

server {
    listen 80;
    server_name YOUR_DOMAIN_HERE;

    client_max_body_size 10m;

    location /static/ {
        alias /srv/holisticmap/staticfiles/;
    }

    location / {
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://unix:/run/holisticmap/gunicorn.sock:;
    }
}
